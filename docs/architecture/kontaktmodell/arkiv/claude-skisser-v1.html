            "<!DOCTYPE html>\n<html lang=\"nb\"><head>\n<meta charset=\"utf-8\">\n<title>Prototype – kontekstbyte<\u002Ftitle>\n<script src=\"330ccd9f-f82e-481e-9ca9-24bfe5290467\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"900\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#0067C5}a:hover{color:#00459C}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1280px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #23262A; font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif; font-size: 16px; line-height: 24px\" data-canvas-width=\"1280\" data-canvas-height=\"900\" data-document-role=\"page\" data-label=\"Klikkbar prototype\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 32px; border-bottom: 1px solid #B4BAC2\">\n<div style=\"display: flex; gap: 12px; align-items: center\">\n<div role=\"img\" aria-label=\"Plasshaldar for Nav-logo\" style=\"width: 64px; height: 40px; box-sizing: border-box; border: 1px dashed #5B6470; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #525962\">Nav-logo<\u002Fdiv>\n<span style=\"font-size: 20px; font-weight: 600\">Aa-registeret<\u002Fspan>\n<b style=\"display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 18px; font-weight: 600; background: #23262A; color: #FFFFFF; white-space: nowrap\">Prototype – forslag<\u002Fb>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\">\n<span>Du opptrer som:<\u002Fspan>\n<sc-for list=\"{{ ctxButtons }}\" as=\"c\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: {{ c.bg }}; color: {{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center; padding: 8px 32px; border-bottom: 1px solid #B4BAC2; background: #F2F3F5\">\n<sc-for list=\"{{ navButtons }}\" as=\"n\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ n.on }}\" sc-camel-on-click=\"{{ n.pick }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 0; cursor: pointer; background: {{ n.bg }}; color: {{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex: 1 1 0; min-height: 0; display: flex; gap: 32px; padding: 24px 32px; overflow: auto\">\n<div style=\"flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<sc-if value=\"{{ altinnNede }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"alert\" style=\"padding: 12px 16px; border: 1px solid #A32A17; border-radius: 8px; background: #FFE6E2\"><b>Feil:<\u002Fb> Vi får ikke kontakt med Altinn akkurat nå. Dette er en teknisk feil, ikke manglende tilgang. Du kan fortsatt bruke «Meg selv».<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ lostB }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"alert\" style=\"padding: 12px 16px; border: 1px solid #8A5A00; border-radius: 8px; background: #FFF1D6; display: flex; flex-direction: column; gap: 8px\"><span><b>Advarsel:<\u002Fb> Du har ikke lenger tilgang til Organisasjon B via Altinn. Vi viser ingen opplysninger derfra.<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showProfil }}\" hint-placeholder-val=\"{{ true }}\">\n<h1 style=\"margin: 0; font-size: 30px; line-height: 38px; font-weight: 600\">Min profil<\u002Fh1>\n<sc-if value=\"{{ isOrg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 12px 16px; border: 1px solid #1A6B3A; border-radius: 8px; background: #DDF3E4\"><b>OK:<\u002Fb> Kontrollert i Altinn nå. Du ser bare opplysninger for {{ ctxName }}.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid #B4BAC2; border-radius: 8px; background: #FFFFFF\">\n<h2 style=\"margin: 0; font-size: 20px; line-height: 28px; font-weight: 600\">{{ addrLabel }}<\u002Fh2>\n<sc-if value=\"{{ isMeg }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0\">Navn: Person A <span style=\"color: #525962\">(fra innlogging, kan ikke endres)<\u002Fspan><\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ showAddr }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"flex: 1 1 0\">{{ addrVal }}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ startEdit }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #FFFFFF; color: #0067C5\">Endre<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ showMissing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 12px 16px; border: 1px solid #8A5A00; border-radius: 8px; background: #FFF1D6; display: flex; flex-direction: column; gap: 8px\"><span><b>Advarsel:<\u002Fb> Du har ikke registrert e-post her. Vi bruker aldri den private adressen din eller adressen din hos en annen organisasjon.<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ startEdit }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #FFFFFF; color: #0067C5; align-self: flex-start\">Legg til<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<label for=\"p-edit\" style=\"font-weight: 600\">Ny e-postadresse<\u002Flabel>\n<input id=\"p-edit\" type=\"email\" value=\"{{ editVal }}\" sc-camel-on-change=\"{{ onEdit }}\" style=\"font: inherit; box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px; border: 2px solid #5B6470; border-radius: 4px; background: #FFFFFF; color: #23262A\">\n<sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin: 0; color: #A32A17; font-weight: 600\">{{ err }}<\u002Fp><\u002Fsc-if>\n<div style=\"display: flex; gap: 12px\"><button type=\"button\" sc-camel-on-click=\"{{ saveEdit }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #0067C5; color: #FFFFFF\">Lagre<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ cancelEdit }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #FFFFFF; color: #0067C5\">Avbryt<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasChanged }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; gap: 12px\">\n<div style=\"flex: 1 1 0; padding: 12px 16px; border: 1px solid #0067C5; border-radius: 8px; background: #E6F0FF\"><b>Dette er endret<\u002Fb><br>{{ changed }}<\u002Fdiv>\n<div style=\"flex: 1 1 0; padding: 12px 16px; border: 1px solid #B4BAC2; border-radius: 8px; background: #F2F3F5\"><b>Dette er ikke endret<\u002Fb><br>{{ unchanged }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ isOrg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid #B4BAC2; border-radius: 8px; background: #FFFFFF\">\n<h2 style=\"margin: 0; font-size: 20px; line-height: 28px; font-weight: 600\">Rollene mine hos {{ ctxName }}<\u002Fh2>\n<sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\"><p style=\"margin: 0\">{{ r.t }}<\u002Fp><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isMeg }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0; color: #525962\">Velg organisasjon øverst for å se kontaktopplysninger og roller der.<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ showFormer }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid #B4BAC2; border-radius: 8px; background: #FFFFFF\">\n<h2 style=\"margin: 0; font-size: 20px; line-height: 28px; font-weight: 600\">Tidligere tilknytninger<\u002Fh2>\n<div style=\"display: flex; gap: 16px; align-items: center\"><span style=\"flex: 1 1 0\"><b>Organisasjon B<\u002Fb><br>Du har ikke lenger tilgang via Altinn<\u002Fspan>\n<sc-if value=\"{{ canRemove }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" sc-camel-on-click=\"{{ removeB }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; border-color: #A32A17; background: #FFFFFF; color: #A32A17\">Fjern e-postadressen min<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ removedB }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #1A6B3A; font-weight: 600\">E-postadressen er fjernet<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showMelding }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"margin: 0; font-size: 30px; line-height: 38px; font-weight: 600\">Ny melding<\u002Fh1>\n<div style=\"padding: 12px 16px; border: 1px solid #0067C5; border-radius: 8px; background: #E6F0FF\">Du sender som: <b>{{ sendSom }}<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"p-emne\" style=\"font-weight: 600\">Emne<\u002Flabel>\n<input id=\"p-emne\" type=\"text\" value=\"{{ emne }}\" sc-camel-on-change=\"{{ onEmne }}\" style=\"font: inherit; box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px; border: 2px solid #5B6470; border-radius: 4px; background: #FFFFFF; color: #23262A\">\n<\u002Fdiv>\n<sc-if value=\"{{ hasAddr }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0\">Svar sendes til: <b>{{ addrVal }}<\u002Fb> <span style=\"color: #525962\">({{ addrLabel }})<\u002Fspan><\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ noAddr }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"p-madr\" style=\"font-weight: 600\">{{ addrLabel }} (påkrevd)<\u002Flabel>\n<span style=\"font-size: 14px; line-height: 20px; color: #525962\">Vi henter ikke adressen fra andre steder.<\u002Fspan>\n<input id=\"p-madr\" type=\"email\" value=\"{{ msgAddr }}\" sc-camel-on-change=\"{{ onMsgAddr }}\" style=\"font: inherit; box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px; border: 2px solid #5B6470; border-radius: 4px; background: #FFFFFF; color: #23262A\">\n<\u002Fdiv>\n<fieldset style=\"border: 0; padding: 0; margin: 0\">\n<legend style=\"font-weight: 600; padding: 0; margin-bottom: 8px\">Hva vil du gjøre med adressen?<\u002Flegend>\n<div style=\"display: flex; gap: 8px; align-items: center; min-height: 36px\"><input type=\"radio\" id=\"p-l1\" name=\"p-lagre\" checked=\"{{ isLagre }}\" sc-camel-on-change=\"{{ pickLagre }}\" style=\"width: 20px; height: 20px; margin: 0\"><label for=\"p-l1\">Lagre som min adresse her<\u002Flabel><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center; min-height: 36px\"><input type=\"radio\" id=\"p-l2\" name=\"p-lagre\" checked=\"{{ isEngang }}\" sc-camel-on-change=\"{{ pickEngang }}\" style=\"width: 20px; height: 20px; margin: 0\"><label for=\"p-l2\">Bruk bare for denne meldingen<\u002Flabel><\u002Fdiv>\n<\u002Ffieldset>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin: 0; color: #A32A17; font-weight: 600\">{{ err }}<\u002Fp><\u002Fsc-if>\n<div><button type=\"button\" sc-camel-on-click=\"{{ send }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #0067C5; color: #FFFFFF\">Send melding<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showKvittering }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"margin: 0; font-size: 30px; line-height: 38px; font-weight: 600\">Kvittering<\u002Fh1>\n<div style=\"padding: 12px 16px; border: 1px solid #1A6B3A; border-radius: 8px; background: #DDF3E4\"><b>OK:<\u002Fb> Meldingen er sendt.<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid #B4BAC2; border-radius: 8px; background: #FFFFFF\">\n<p style=\"margin: 0\">Sendt som: <b>{{ last.som }}<\u002Fb><\u002Fp>\n<p style=\"margin: 0\">Svar sendes til: <b>{{ last.til }}<\u002Fb><\u002Fp>\n<p style=\"margin: 0\">{{ last.info }}<\u002Fp>\n<\u002Fdiv>\n<div><button type=\"button\" sc-camel-on-click=\"{{ goListe }}\" style=\"font: inherit; font-weight: 600; min-height: 44px; padding: 6px 14px; border-radius: 4px; border: 2px solid #0067C5; cursor: pointer; background: #FFFFFF; color: #0067C5\">Gå til mine meldinger<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showListe }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"margin: 0; font-size: 30px; line-height: 38px; font-weight: 600\">Mine meldinger<\u002Fh1>\n<div style=\"padding: 12px 16px; border: 1px solid #0067C5; border-radius: 8px; background: #E6F0FF\">Du ser bare meldinger du har sendt som: <b>{{ sendSom }}<\u002Fb><\u002Fdiv>\n<sc-if value=\"{{ noMsgs }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0\">Du har ikke sendt meldinger i denne konteksten.<\u002Fp><\u002Fsc-if>\n<sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid #B4BAC2; border-radius: 8px; background: #FFFFFF; gap: 4px\">\n<b>{{ m.emne }}<\u002Fb>\n<span>Sendt som: {{ m.som }}<\u002Fspan>\n<span>Svar går til: {{ m.til }}<\u002Fspan>\n<sc-if value=\"{{ m.endret }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #6B4500; font-weight: 600\">Adressen din er endret etter innsending<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ m.eng }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #525962\">Adressen ble brukt bare for denne meldingen<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"flex: 0 0 320px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px dashed #5B6470; border-radius: 8px; align-self: flex-start; font-size: 14px; line-height: 20px\">\n<b style=\"font-size: 16px\">Prøv dette<\u002Fb>\n<ol style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li>Byt mellom «Meg selv», Organisasjon A og Organisasjon B øvst. Profilen viser berre éin kontekst om gongen.<\u002Fli>\n<li>Vel Organisasjon B og «Ny melding». Adressefeltet er tomt og påkravd. Ingen adresse blir føreslått.<\u002Fli>\n<li>Endre adressa hos Organisasjon A. Privat adresse står urørt, og gamle meldingar held på adressa si.<\u002Fli>\n<li>Opne Tweaks og slå på «Altinn svarar ikkje» eller «Mista rett til B».<\u002Fli>\n<\u002Fol>\n<span style=\"color: #525962\">Berre plasshaldarar. Ingenting blir lagra eller sendt. Kodesteget ved adresseendring er vist i E4.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 900}, &quot;altinnNede&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;section&quot;: &quot;Simuler&quot;}, &quot;mistaRettB&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;section&quot;: &quot;Simuler&quot;}}\">\nclass Component extends DCLogic {\nstate = {\n  ctx: 'meg', view: 'profil',\n  addr: { meg: 'privat@eksempel.no', a: 'person@org-a.eksempel.no', b: '' },\n  editing: false, editVal: '', changed: '', err: '',\n  emne: '', msgAddr: '', lagre: true, removedB: false,\n  msgs: [{ id: 1, ctx: 'a', emne: 'Spørsmål om søknad', som: 'innsender for Organisasjon A', til: 'person@org-a.eksempel.no', eng: false }],\n  last: { som: '', til: '', info: '' }\n};\nrenderVals() {\n  const s = this.state;\n  const nede = !!this.props.altinnNede;\n  const mista = !!this.props.mistaRettB;\n  let ctx = s.ctx;\n  const lostB = s.ctx === 'b' && mista && !nede;\n  if (ctx !== 'meg' && nede) ctx = 'meg';\n  if (ctx === 'b' && mista) ctx = 'meg';\n  const names = { meg: 'Meg selv', a: 'Organisasjon A', b: 'Organisasjon B' };\n  const som = { meg: 'deg selv', a: 'innsender for Organisasjon A', b: 'brukerstøtte for Organisasjon B' };\n  const label = { meg: 'Privat e-post', a: 'E-post hos Organisasjon A', b: 'E-post hos Organisasjon B' };\n  const rest = {\n    meg: 'E-post hos organisasjoner, og adressen på meldinger du allerede har sendt.',\n    a: 'Privat e-post, e-post hos Organisasjon B, og adressen på meldinger du allerede har sendt.',\n    b: 'Privat e-post, e-post hos Organisasjon A, og adressen på meldinger du allerede har sendt.'\n  };\n  const roles = { meg: [], a: [{ t: 'Innsender · 2 søknader' }, { t: 'Faglig kontakt · 1 avtale' }], b: [{ t: 'Brukerstøtte' }] };\n  const ids = ['meg'];\n  if (!nede) { ids.push('a'); if (!mista) ids.push('b'); }\n  const reset = { editing: false, changed: '', err: '', msgAddr: '' };\n  const ctxButtons = ids.map((id) => ({\n    label: names[id], on: id === ctx,\n    bg: id === ctx ? '#0067C5' : '#FFFFFF', fg: id === ctx ? '#FFFFFF' : '#0067C5',\n    pick: () => this.setState(Object.assign({ ctx: id, view: s.view === 'kvittering' ? 'profil' : s.view }, reset))\n  }));\n  const views = [['profil', 'Min profil'], ['melding', 'Ny melding'], ['liste', 'Mine meldinger']];\n  const navButtons = views.map((v) => ({\n    label: v[1], on: v[0] === s.view,\n    bg: v[0] === s.view ? '#23262A' : 'transparent', fg: v[0] === s.view ? '#FFFFFF' : '#23262A',\n    pick: () => this.setState(Object.assign({ view: v[0] }, reset))\n  }));\n  const addrVal = s.addr[ctx];\n  const hasAddr = !!addrVal;\n  const okMail = (v) => /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(v);\n  const setAddr = (v) => Object.assign({}, s.addr, { [ctx]: v });\n  const msgs = s.msgs.filter((m) => m.ctx === ctx).map((m) => Object.assign({}, m, { endret: !m.eng && m.til !== s.addr[m.ctx] }));\n  return {\n    ctxButtons, navButtons, ctxName: names[ctx], sendSom: som[ctx], addrLabel: label[ctx], addrVal,\n    altinnNede: nede, lostB,\n    isMeg: ctx === 'meg', isOrg: ctx !== 'meg', hasAddr, noAddr: !hasAddr,\n    showProfil: s.view === 'profil', showMelding: s.view === 'melding', showListe: s.view === 'liste', showKvittering: s.view === 'kvittering',\n    showAddr: hasAddr && !s.editing, showMissing: !hasAddr && !s.editing, editing: s.editing,\n    editVal: s.editVal, err: s.err, hasErr: !!s.err, changed: s.changed, hasChanged: !!s.changed, unchanged: rest[ctx],\n    roles: roles[ctx], showFormer: mista && ctx === 'meg', canRemove: !s.removedB, removedB: s.removedB,\n    emne: s.emne, msgAddr: s.msgAddr, isLagre: s.lagre, isEngang: !s.lagre, last: s.last,\n    msgs, noMsgs: msgs.length === 0,\n    startEdit: () => this.setState({ editing: true, editVal: addrVal, changed: '', err: '' }),\n    cancelEdit: () => this.setState({ editing: false, err: '' }),\n    onEdit: (ev) => this.setState({ editVal: ev.target.value }),\n    saveEdit: () => {\n      const v = s.editVal.trim();\n      if (!okMail(v)) { this.setState({ err: 'Skriv en gyldig e-postadresse.' }); return; }\n      this.setState({ addr: setAddr(v), editing: false, err: '', changed: label[ctx] + ' er nå ' + v + '.' });\n    },\n    removeB: () => this.setState({ removedB: true, addr: Object.assign({}, s.addr, { b: '' }) }),\n    onEmne: (ev) => this.setState({ emne: ev.target.value }),\n    onMsgAddr: (ev) => this.setState({ msgAddr: ev.target.value }),\n    pickLagre: () => this.setState({ lagre: true }),\n    pickEngang: () => this.setState({ lagre: false }),\n    goListe: () => this.setState({ view: 'liste' }),\n    send: () => {\n      const to = hasAddr ? addrVal : s.msgAddr.trim();\n      if (!okMail(to)) { this.setState({ err: 'Du må oppgi e-postadressen du bruker her. Vi henter den ikke fra andre steder.' }); return; }\n      const eng = !hasAddr && !s.lagre;\n      const info = hasAddr ? 'Adressen er hentet fra denne konteksten.' : (eng ? 'Adressen brukes bare for denne meldingen. Den er ikke lagret i profilen din.' : 'Adressen er lagret som din adresse i denne konteksten.');\n      const m = { id: s.msgs.length + 1, ctx: ctx, emne: s.emne.trim() || 'Uten emne', som: som[ctx], til: to, eng: eng };\n      this.setState({\n        msgs: s.msgs.concat([m]), addr: (!hasAddr && s.lagre) ? setAddr(to) : s.addr,\n        last: { som: som[ctx], til: to, info: info }, view: 'kvittering', err: '', emne: '', msgAddr: ''\n      });\n    }\n  };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
