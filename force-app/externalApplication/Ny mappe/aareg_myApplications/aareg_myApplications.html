<template>
  <c-aareg_main-banner>Aa-registeret - Mine Søknader</c-aareg_main-banner>
  <div class="container">
    <div class="inner-container">
      <div class="breadcrumbs">
        <c-breadcrumbs url-list={breadcrumbs}></c-breadcrumbs>
      </div>
      <div class="no-applications-container">
        <p>Har du spørsmål til søknaden kan du kontakte Nav registerforvaltning <a href="#" onclick={navigateToNyMelding}>Send melding</a></p>
      </div>
      <div if:true={isMobile} style="height: 600px;">
        <lightning-datatable
          key-field="id"
          data={applications}
          class="slds-max-medium-table_stacked"
          columns={columns}
          onrowaction={handleRowAction}
          hide-checkbox-column="true">
        </lightning-datatable>
      </div>
      <div if:false={isMobile}>
        <lightning-datatable
          key-field="id"
          data={applications}
          columns={columns}
          onrowaction={handleRowAction}
          hide-checkbox-column="true">
        </lightning-datatable>
      </div>
      <div if:false={applications} class="no-applications-container">
        <p>Det finnes ingen aktive søknader.</p>
      </div>
    </div>
  </div>
</template>
