<template>
  <c-aareg_main-banner>Aa-registeret - Mine Søknader</c-aareg_main-banner>
  <div class="container">
    <div class="inner-container">
      <div class="breadcrumbs">
        <c-breadcrumbs url-list={breadcrumbs}></c-breadcrumbs>
      </div>
      <div class="no-applications-container">
        <p>Har du spørsmål til søknaden kan du kontakte <a href="#" onclick={navigateToNyMelding}>Nav registerforvaltning</a></p>
      </div>
      <div class="slds-m-bottom_medium" if:true={hasApplications}>
        <lightning-combobox
          name="statusFilter"
          label="Filtrer på status"
          value={selectedStatusFilter}
          options={statusFilterOptions}
          onchange={handleStatusFilterChange}>
        </lightning-combobox>
      </div>
      <div if:true={isMobile} style="height: 600px;">
        <lightning-datatable
          key-field="id"
          data={filteredApplications}
          class="slds-max-medium-table_stacked"
          columns={columns}
          onrowaction={handleRowAction}
          hide-checkbox-column="true">
        </lightning-datatable>
      </div>
      <div if:false={isMobile}>
        <lightning-datatable
          key-field="id"
          data={filteredApplications}
          columns={columns}
          onrowaction={handleRowAction}
          hide-checkbox-column="true">
        </lightning-datatable>
      </div>
      <div class="no-applications-container">
        <p>Søknader med status Utkast og Henlagt bli automatisk slettet etter et år.</p>
      </div>
      <div if:false={hasApplications} class="no-applications-container">
        <p>Det finnes ingen aktive søknader.</p>
      </div>
      <div if:true={showNoFilteredResults} class="no-applications-container">
        <p>Ingen søknader med valgt status.</p>
      </div>
    </div>
  </div>
</template>
