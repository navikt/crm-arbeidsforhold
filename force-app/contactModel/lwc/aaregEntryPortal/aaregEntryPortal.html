<template>
    <template lwc:if={showPortal}>
        <section class="portal" aria-labelledby="portal-heading">
            <template lwc:if={message}>
                <div class="alert alert_warning" role="status" data-id="message">{message}</div>
            </template>
            <h1 id="portal-heading" class="heading">Brukerstøtte og søknad om tilgang til Aa-registeret</h1>
            <p class="lead">Hvordan vil du bruke tjenesten?</p>

            <template lwc:if={hasRoles}>
                <ul class="roles" aria-label="Roller" data-id="roles">
                    <template for:each={roles} for:item="role">
                        <li key={role.roleKey} class="role">
                            <a
                                href="#"
                                class="role-link"
                                data-role={role.roleKey}
                                onclick={handleRole}
                                aria-describedby={role.roleKey}
                            >
                                <span class="role-title">{role.title}</span>
                                <span class="role-description" id={role.roleKey}>{role.description}</span>
                                <span class="role-continue" aria-hidden="true">Fortsett →</span>
                            </a>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <div class="alert alert_info" data-id="no-roles">
                    Ingen roller er tilgjengelige akkurat nå. Prøv igjen senere.
                </div>
            </template>

            <template lwc:if={showProfile}>
                <div class="profile" data-id="profile">
                    <c-link-panel
                        title="Min profil"
                        sub-title="Her ser og endrer du e-postadressene dine: den private og den du bruker for hver virksomhet."
                        relative-path="Min_Profil__c"
                    ></c-link-panel>
                </div>
            </template>
        </section>
    </template>
    <template lwc:elseif={showCurrentHome}>
        <c-aareg_home data-id="current-home"></c-aareg_home>
    </template>
    <template lwc:else>
        <div class="loading" role="status" data-id="loading">
            <lightning-spinner alternative-text="Laster" size="medium"></lightning-spinner>
        </div>
    </template>
</template>
