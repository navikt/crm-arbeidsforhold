<template>
    <section class="start" aria-labelledby="start-heading">
        <h1 id="start-heading" class="heading">Ny søknad om tilgang til Aa-registeret</h1>
        <p class="lead">Vel først korleis du brukar tenesta. Ingenting er valt på førehand.</p>

        <fieldset class="roles" data-id="roles">
            <legend class="legend">Korleis søkjer du?</legend>
            <template for:each={roles} for:item="role">
                <div key={role.value} class="role">
                    <input
                        type="radio"
                        id={role.id}
                        name="role"
                        value={role.value}
                        checked={role.checked}
                        aria-describedby={role.descriptionId}
                        onchange={handleRole}
                        data-role={role.value}
                    />
                    <label for={role.id} class="role-label">{role.label}</label>
                    <p id={role.descriptionId} class="role-description">{role.description}</p>
                </div>
            </template>
        </fieldset>

        <template lwc:if={isPrivate}>
            <div class="alert alert_info" data-id="private">
                Tilgang til Aa-registeret blir gitt til organisasjonar, så du kan ikkje søkje som privatperson. Du kan
                sjå og endre adressa du brukar på eigne vegner på
                <a href={profileUrl} data-id="profile-link">Min profil</a>.
            </div>
        </template>

        <template lwc:if={loadingOrganizations}>
            <p class="status" role="status" data-id="loading">Hentar organisasjonane dine frå Altinn …</p>
        </template>

        <template lwc:if={organizationsError}>
            <div class="alert alert_warning" role="alert" data-id="organizations-error">{organizationsError}</div>
        </template>

        <template lwc:if={showSelector}>
            <form class="card" onsubmit={handleContinue} data-id="organization-form" novalidate>
                <c-aareg-org-selector
                    label="Kva organisasjon søkjer du for?"
                    organizations={organizations}
                    selected={selectedValue}
                    onselect={handleSelect}
                ></c-aareg-org-selector>
                <p class="hint">Vi stadfestar rolla di i Altinn før du går vidare.</p>
                <template lwc:if={error}>
                    <div class="alert alert_error" role="alert" data-id="error">{error}</div>
                </template>
                <div class="actions">
                    <button class="button" type="submit" disabled={continueDisabled} data-id="continue">
                        Gå vidare til søknaden
                    </button>
                </div>
            </form>
        </template>
    </section>
</template>
