<template>
    <main class="profile" aria-labelledby="profile-heading">
        <h1 id="profile-heading" class="navds-heading navds-heading--xlarge heading">Min profil</h1>
        <p class="navds-body-long lead">Vel først kven det gjeld. Du ser berre adressa for konteksten du har valt.</p>

        <template lwc:if={loading}>
            <c-aareg-loader data-id="loading" label="Hentar …"></c-aareg-loader>
        </template>

        <template lwc:if={error}>
            <c-aareg-alert class="block" variant="error" data-id="error">{error}</c-aareg-alert>
        </template>

        <template lwc:if={disabled}>
            <c-aareg-alert class="block" variant="info" data-id="disabled"
                >Profilsida er ikkje tilgjengeleg for deg enno.</c-aareg-alert
            >
        </template>

        <template lwc:if={enabled}>
            <template lwc:if={organizationsError}>
                <c-aareg-alert class="block" variant="warning" data-id="organizations-error">
                    {organizationsError} Du kan framleis endre adressa for «Meg selv».
                </c-aareg-alert>
            </template>

            <c-aareg-org-selector
                organizations={organizations}
                include-self
                selected={selectedValue}
                onselect={handleSelect}
            ></c-aareg-org-selector>

            <template lwc:if={nothingSelected}>
                <p class="navds-body-long placeholder" data-id="choose-first">
                    Ingen opplysningar blir viste før du har valt «Meg selv» eller ein organisasjon. Vi stadfestar rolla
                    di i Altinn kvar gong du vel ein organisasjon.
                </p>
            </template>

            <template lwc:if={organizationDenied}>
                <c-aareg-alert class="block" variant="warning" data-id="denied">{organizationMessage}</c-aareg-alert>
            </template>

            <template lwc:if={organizationMissing}>
                <c-aareg-alert class="block" variant="info" data-id="missing">{organizationMessage}</c-aareg-alert>
            </template>

            <template lwc:if={showForm}>
                <form class="navds-panel navds-panel--border card" onsubmit={handleSave} data-id="form" novalidate>
                    <h2 class="navds-heading navds-heading--medium card-heading">{contextHeading}</h2>
                    <p class="navds-body-long hint">{contextExplanation}</p>
                    <c-aareg-text-field
                        class="field"
                        data-id="email"
                        type="email"
                        autocomplete="email"
                        label="E-post"
                        value={email}
                        required
                        message-when-value-missing="Skriv inn e-postadressa."
                        message-when-type-mismatch="Skriv inn ei gyldig e-postadresse."
                        onchange={handleEmail}
                    ></c-aareg-text-field>
                    <c-aareg-text-field
                        class="field"
                        data-id="phone"
                        type="tel"
                        label="Telefon (valfritt)"
                        value={phone}
                        onchange={handlePhone}
                    ></c-aareg-text-field>
                    <div class="actions">
                        <button
                            class="navds-button navds-button--primary"
                            type="submit"
                            disabled={saving}
                            data-id="save"
                        >
                            <span class="navds-label">Lagre adressa</span>
                        </button>
                    </div>
                    <template lwc:if={saved}>
                        <c-aareg-alert class="block" variant="success" size="small" role="status" data-id="saved"
                            >{saved}</c-aareg-alert
                        >
                    </template>
                </form>
            </template>
        </template>
    </main>
</template>
