<template>
    <main class="profile" aria-labelledby="profile-heading">
        <h1 id="profile-heading" class="heading">Min profil</h1>
        <p class="lead">Vel først kven det gjeld. Du ser berre adressa for konteksten du har valt.</p>

        <template lwc:if={loading}>
            <p class="status" role="status" data-id="loading">Hentar …</p>
        </template>

        <template lwc:if={error}>
            <div class="alert alert_error" role="alert" data-id="error">{error}</div>
        </template>

        <template lwc:if={disabled}>
            <div class="alert alert_info" data-id="disabled">Profilsida er ikkje tilgjengeleg for deg enno.</div>
        </template>

        <template lwc:if={enabled}>
            <template lwc:if={organizationsError}>
                <div class="alert alert_warning" role="alert" data-id="organizations-error">
                    {organizationsError} Du kan framleis endre adressa for «Meg selv».
                </div>
            </template>

            <c-aareg-org-selector
                organizations={organizations}
                include-self
                selected={selectedValue}
                onselect={handleSelect}
            ></c-aareg-org-selector>

            <template lwc:if={nothingSelected}>
                <p class="placeholder" data-id="choose-first">
                    Ingen opplysningar blir viste før du har valt «Meg selv» eller ein organisasjon. Vi stadfestar rolla
                    di i Altinn kvar gong du vel ein organisasjon.
                </p>
            </template>

            <template lwc:if={organizationDenied}>
                <div class="alert alert_warning" role="alert" data-id="denied">{organizationMessage}</div>
            </template>

            <template lwc:if={organizationMissing}>
                <div class="alert alert_info" data-id="missing">{organizationMessage}</div>
            </template>

            <template lwc:if={showForm}>
                <form class="card" onsubmit={handleSave} data-id="form" novalidate>
                    <h2 class="card-heading">{contextHeading}</h2>
                    <p class="hint">{contextExplanation}</p>
                    <lightning-input
                        data-id="email"
                        type="email"
                        label="E-post"
                        value={email}
                        required
                        message-when-value-missing="Skriv inn e-postadressa."
                        message-when-type-mismatch="Skriv inn ei gyldig e-postadresse."
                        onchange={handleEmail}
                    ></lightning-input>
                    <lightning-input
                        data-id="phone"
                        type="tel"
                        label="Telefon (valfritt)"
                        value={phone}
                        onchange={handlePhone}
                    ></lightning-input>
                    <div class="actions">
                        <button class="button" type="submit" disabled={saving} data-id="save">Lagre adressa</button>
                    </div>
                    <template lwc:if={saved}>
                        <p class="alert alert_success" role="status" data-id="saved">{saved}</p>
                    </template>
                </form>
            </template>
        </template>
    </main>
</template>
