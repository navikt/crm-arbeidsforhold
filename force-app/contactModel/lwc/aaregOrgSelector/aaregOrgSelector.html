<template>
    <div class="selector">
        <label class="label" for={inputId}>{label}</label>
        <p class="hint" id={hintId}>{hint}</p>
        <p class="current" data-id="current">Valt: <strong>{selectedText}</strong></p>
        <div class="combobox">
            <input
                id={inputId}
                class="input"
                type="text"
                role="combobox"
                autocomplete="off"
                aria-autocomplete="list"
                aria-expanded={expanded}
                aria-controls={listboxId}
                aria-activedescendant={activeDescendant}
                aria-describedby={describedBy}
                placeholder="Til dømes «Nav» eller 889 640 782"
                value={query}
                onfocus={handleFocus}
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onblur={handleBlur}
            />
            <template lwc:if={open}>
                <ul class="listbox" id={listboxId} role="listbox" aria-label={label}>
                    <template for:each={filtered} for:item="option">
                        <li
                            key={option.id}
                            id={option.id}
                            class={option.className}
                            role="option"
                            aria-selected={option.selected}
                            data-value={option.value}
                            onmousedown={handleOptionMouseDown}
                            onclick={handleOptionClick}
                        >
                            <span class="option-name">{option.name}</span>
                            <span class="option-number">{option.number}</span>
                            <template lwc:if={option.hasParent}>
                                <span class="option-parent">Underenhet av {option.parentName}</span>
                            </template>
                        </li>
                    </template>
                    <template lwc:if={hasNoMatches}>
                        <li class="empty" role="presentation">
                            Ingen treff. Sjekk namnet eller nummeret, eller rolla di i Altinn.
                        </li>
                    </template>
                </ul>
            </template>
        </div>
        <p class="assistive" id={statusId} role="status" aria-live="polite">{statusText}</p>
    </div>
</template>
