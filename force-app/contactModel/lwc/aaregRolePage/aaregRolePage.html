<template>
    <section class="role-page" aria-labelledby="role-heading">
        <div class="role-bar" data-id="role-bar">
            <span class="role-name">Rolle: {roleTitle}</span>
            <a href="#" class="change-role" onclick={handleChangeRole} data-id="change-role">Bytt rolle</a>
        </div>
        <h1 id="role-heading" class="heading">Min side – Brukerstøtte og søknad om tilgang til Aa-registeret</h1>

        <template lwc:if={showSelector}>
            <div class="selector" data-id="organization-selector">
                <template lwc:if={loadingOrganizations}>
                    <p class="status" role="status" data-id="loading-organizations">
                        Henter virksomhetene dine fra Altinn …
                    </p>
                </template>
                <template lwc:elseif={organizationsError}>
                    <div class="alert alert_warning" role="alert" data-id="organizations-error">
                        {organizationsError}
                    </div>
                </template>
                <template lwc:else>
                    <c-aareg-org-selector
                        label={selectorLabel}
                        hint="Søk på navn eller organisasjonsnummer."
                        organizations={organizations}
                        selected={selectedOrganization}
                        onselect={handleSelect}
                    ></c-aareg-org-selector>
                </template>
                <button class="link-button refresh" type="button" onclick={handleRefresh} data-id="refresh">
                    Oppdater liste
                </button>
            </div>
            <template lwc:if={showSelectHint}>
                <p class="lead" data-id="select-hint">
                    Velg en virksomhet for å se hva du har tilgang til. Vi sjekker tilgangen din i Altinn.
                </p>
            </template>
        </template>

        <template lwc:if={isPrivate}>
            <div class="info" data-id="private-info">
                Du bruker tjenesten på egne vegne. Du trenger ikke velge virksomhet.
            </div>
        </template>

        <template lwc:if={message}>
            <div class="alert alert_warning" role="alert" data-id="message">{message}</div>
        </template>

        <template lwc:if={isLoading}>
            <div class="loading" role="status" data-id="loading">
                <lightning-spinner alternative-text="Sjekker tilgangen din" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={isError}>
            <div class="alert alert_error" role="alert" data-id="technical-error">
                <p>
                    Vi får ikke kontakt med Altinn akkurat nå, så vi kan ikke sjekke tilgangen din. Prøv igjen om litt.
                </p>
                <button class="button button_secondary" type="button" onclick={handleRetry} data-id="retry">
                    Prøv igjen
                </button>
            </div>
        </template>

        <template lwc:if={isGranted}>
            <div class="columns" data-id="panels">
                <template for:each={panelColumns} for:item="column">
                    <ul key={column.key} class="panels" aria-label={column.label}>
                        <template for:each={column.panels} for:item="panel">
                            <li key={panel.key} class="panel" data-panel={panel.key}>
                                <c-link-panel
                                    title={panel.title}
                                    sub-title={panel.subTitle}
                                    relative-path={panel.page}
                                ></c-link-panel>
                            </li>
                        </template>
                    </ul>
                </template>
            </div>
            <template lwc:if={showPrivateOutlook}>
                <p class="lead" data-id="private-coming">Flere tjenester for privatpersoner kommer.</p>
            </template>
        </template>
    </section>
</template>
