<template>
    <template if:true={isLoaded}>
        <div if:true={showError} class="error-dropdown" onclick={closeErrorMessage}>
            <div class="empty-flex"></div>
            <div class="error-message" aria-live="assertive" aria-atomic="true">
                <h2>{errorMsg}</h2>
            </div>
            <div class="close-error-button">
                <lightning-icon
                    icon-name="utility:close"
                    variant="inverse"
                    onclick={closeErrorMessage}
                    style="padding-right: 1rem; cursor: pointer"
                ></lightning-icon>
            </div>
        </div>
        <div class="home-container bedriftsmeny">
            <div style="flex: 1"></div>
            <div class="home_header">
                <h1 class="typo-innholdstittel bedriftsmeny__tittel">
                    Min side - Brukerstøtte og søknad om tilgang til Aa-registeret
                </h1>
            </div>
            <div class="org_picker" aria-busy={isRefreshing}>
                <template if:true={hasOrganizations}>
                    <select
                        class="organization-select"
                        aria-label="Velg virksomhet"
                        aria-invalid="false"
                        disabled={isRefreshing}
                        onchange={handleOrganizationChange}
                    >
                        <option value="" selected={hasNoSelectedOrganization}>-- Velg virksomhet --</option>
                        <template for:each={organizationOptions} for:item="organization">
                            <option
                                key={organization.organizationNumber}
                                value={organization.organizationNumber}
                                selected={organization.isSelected}
                            >
                                {organization.name} - ({organization.organizationNumber})
                            </option>
                        </template>
                    </select>
                </template>
                <div class="organization-actions">
                    <lightning-button
                        data-id="refresh-organizations"
                        label={labels.refreshOrganizations}
                        variant="neutral"
                        icon-name="utility:refresh"
                        icon-position="left"
                        disabled={isRefreshing}
                        onclick={handleRefresh}
                    ></lightning-button>
                    <template if:true={isRefreshing}>
                        <lightning-spinner
                            alternative-text={labels.refreshOrganizations}
                            size="small"
                        ></lightning-spinner>
                    </template>
                </div>
            </div>
        </div>
        <template if:true={hasNoOrganizations}>
            <section data-id="organization-empty-state" role="status">
                <div class="mangler-tilgang-bakgrunn organization-empty-state">
                    <h2 class="typo-innholdstittel mangler-tilgang-bakgrunn__innholdstittel">
                        {labels.noOrganizationsTitle}
                    </h2>
                    <p class="missing-access-subtitle">{labels.noOrganizationsDescription}</p>
                    <p class="missing-access-subtitle">{labels.noOrganizationsGuidance}</p>
                </div>
            </section>
        </template>
        <template if:true={hasAccess}>
            <div class="slds-grid inner-container">
                <div class="slds-col" style="flex: 50%">
                    <div if:true={hasApplicationAccess} class="slds-col">
                        <c-link-panel
                            title="Ny søknad"
                            sub-title="Her kan du opprette en ny søknad."
                            relative-path="custom_ny_soknad_aa_registret__c"
                            style="display: flex; width: 100%"
                        ></c-link-panel>
                    </div>
                    <div if:true={hasApplicationAccess} class="slds-col">
                        <c-link-panel
                            title="Mine søknader"
                            sub-title="Her finner du en oversikt over dine innsendte søknader. Er søknaden avslått, eller henlagt finner du informasjon om dette her. Har du startet på en søknad som ikke er sendt inn, finner du den her med status «Utkast». "
                            relative-path="custom_mine_soknader__c"
                            style="display: flex; width: 100%"
                        ></c-link-panel>
                    </div>
                    <div class="slds-col">
                        <c-link-panel
                            title="Mine avtaler"
                            sub-title="Her finner du oversikt over godkjente avtaler og mulighet for å laste ned vedtak. Du kan også se og endre kontaktpersoner, eller avslutte avtalen."
                            relative-path="Mine_Avtaler__c"
                            style="display: flex; width: 100%"
                        ></c-link-panel>
                    </div>
                </div>
                <div class="slds-col" style="flex: 50%">
                    <div class="slds-col">
                        <c-link-panel
                            title="Brukerstøtte vedrørende Aa-registeret"
                            sub-title="Har du spørsmål knyttet til Aa-registeret kan du kontakte oss ved å sende en melding."
                            relative-path="Ny_Melding__c"
                            style="display: flex; width: 100%"
                        ></c-link-panel>
                    </div>
                    <div class="slds-col">
                        <c-link-panel
                            title="Mine meldinger"
                            sub-title="Her finner du svar på henvendelser som du har sendt vedrørende Aa-registeret."
                            relative-path="Mine_Meldinger__c"
                            unread-count={unreadThreadCount}
                            style="display: flex; width: 100%"
                        ></c-link-panel>
                    </div>
                </div>
            </div>
        </template>
        <template if:true={showMissingAccess}>
            <c-aareg_missing-access></c-aareg_missing-access>
        </template>
    </template>
    <template if:false={isLoaded}>
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </template>
</template>
