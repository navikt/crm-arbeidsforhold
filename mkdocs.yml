not_in_nav: |
    *.mmd.md
    /integrations/context/
    /architecture/aaregisteret-pakkeavstemming-2026-11-14.md
    /operations/experience-cloud-console-2026-10-28.md
    /operations/p360-og-crm-arbeidsforhold-testgjennomgang.md
hooks:
    - docs-site/hooks.py
validation:
    nav:
        omitted_files: warn
    links:
        unrecognized_links: warn
        anchors: warn
markdown_extensions:
    - tables
    - toc:
          permalink: true
          slugify: !!python/object/apply:pymdownx.slugs.slugify
              kwds:
                  case: lower
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
