name: "[PUSH] Deploy to Dev"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-source-dev
  cancel-in-progress: false
jobs:
  deploy-metadata:
    name: Deploy metadata to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        uses: navikt/crm-workflows-base/.github/actions/installSF@aad6b4f48e419d71490db436da697cd7581a2c6a

      - name: Authenticate Dev Hub
        uses: navikt/crm-workflows-base/.github/actions/authenticateOrg@aad6b4f48e419d71490db436da697cd7581a2c6a
        with:
          auth-url: ${{ secrets.CRM_PROD_SFDX_URL }}
          alias: prod
          setDefaultUsername: false
          setDefaultDevhubUsername: true

      - name: Authenticate dev sandbox
        uses: navikt/crm-workflows-base/.github/actions/authenticateOrg@aad6b4f48e419d71490db436da697cd7581a2c6a
        with:
          auth-url: ${{ secrets.DEV_SFDX_URL }}
          alias: dev
          setDefaultUsername: true
          setDefaultDevhubUsername: false

      - name: Install missing or outdated dependencies
        env:
          PACKAGE_INSTALL_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
        run: bash bin/create-scratch-org.sh --no-config --alias dev --update-packages --skip-version-check

      - name: Deploy metadata and run local Apex tests
        run: sf project deploy start --source-dir force-app --target-org dev --test-level RunLocalTests --wait 60
