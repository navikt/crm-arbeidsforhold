name: Scratch org offline

on:
    pull_request:
        paths:
            - 'bin/**'
            - 'scripts/*.cjs'
            - 'scripts/tests/**'
            - 'package.json'
            - 'sfdx-project.json'
            - 'sf-project.config.json'
            - '.github/workflows/**'
    push:
        branches: [main]
        paths:
            - 'bin/**'
            - 'scripts/*.cjs'
            - 'scripts/tests/**'
            - 'package.json'
            - 'sfdx-project.json'
            - 'sf-project.config.json'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        name: Windows 2025 / PowerShell 7.6.6 LTS
        runs-on: windows-2025
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - name: Prepare pinned PowerShell LTS
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
                  Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
                  if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860') {
                      throw 'PowerShell distribution checksum mismatch.'
                  }
                  $directory = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6'
                  Expand-Archive -LiteralPath $archive -DestinationPath $directory
                  $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            - name: Verify runtime and record revision
              shell: pwsh
              run: |
                  if ($PSVersionTable.PSVersion.ToString() -ne '7.6.6') { throw 'Expected PowerShell 7.6.6 LTS.' }
                  $PSVersionTable
                  [Runtime.InteropServices.RuntimeInformation]::OSDescription
                  git rev-parse HEAD
                  node --version
                  npm --version
            - name: PowerShell, CMD and npm contract
              shell: pwsh
              run: pwsh -NoLogo -NoProfile -File bin/tests/create-scratch-org.Tests.ps1 -RequireWindows
            - name: Legacy coverage script contract
              shell: pwsh
              run: pwsh -NoLogo -NoProfile -File bin/tests/post-package-coverage-check.Tests.ps1 -RequireWindows
            - name: Node launcher and tooling regression
              shell: pwsh
              run: npm run test:node
    bash:
        name: Bash and Node regression
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - name: Record environment and revision
              run: |
                  git rev-parse HEAD
                  bash --version
                  node --version
                  jq --version
            - name: Offline regression
              run: |
                  npm run test:node
                  bash bin/tests/create-scratch-org.test.sh
    macos-bash32:
        name: macOS system Bash 3.2 regression
        runs-on: macos-15
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - name: Pin system Bash first on PATH
              run: |
                  shim="$RUNNER_TEMP/system-bash"
                  mkdir -p "$shim"
                  ln -sf /bin/bash "$shim/bash"
                  echo "$shim" >> "$GITHUB_PATH"
            - name: Record environment and revision
              run: |
                  git rev-parse HEAD
                  bash --version
                  [[ "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" == "3" ]] || { echo "Expected macOS system Bash 3.2 first on PATH."; exit 1; }
                  jq --version
            - name: Offline regression with Bash 3.2
              shell: /bin/bash -e {0}
              run: /bin/bash bin/tests/create-scratch-org.test.sh
