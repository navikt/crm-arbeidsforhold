name: Salesforce validation

on:
    workflow_call:
        secrets:
            CRM_PROD_SFDX_URL:
                required: true
            CRM_PACKAGE_KEY:
                required: false

permissions:
    contents: read
    pull-requests: read
    actions: read

jobs:
    changes:
        name: Detect relevant changes
        runs-on: ubuntu-latest
        outputs:
            salesforce: ${{ steps.changes.outputs.salesforce }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Classify PR changes
              id: changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  filter=scripts/ci-changes.cjs
                  if [ -z "$(git ls-tree --name-only "$BASE_SHA" -- "$filter")" ]; then
                    echo "Trusted base filter is not available yet; run full validation."
                    echo "salesforce=true" >> "$GITHUB_OUTPUT"
                    echo "lwc=true" >> "$GITHUB_OUTPUT"
                  else
                    git show "$BASE_SHA:$filter" > "$RUNNER_TEMP/ci-changes.cjs"
                    node "$RUNNER_TEMP/ci-changes.cjs" "$BASE_SHA" "$HEAD_SHA"
                  fi

    salesforce:
        name: Salesforce validation
        needs: changes
        if: >-
            needs.changes.outputs.salesforce == 'true' &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/workflows/ci-reusable-scratch-org.yml
        permissions:
            contents: read
            pull-requests: read
            actions: read
        with:
            pull_number: ${{ github.event.pull_request.number }}
            head_sha: ${{ github.event.pull_request.head.sha }}
            base_sha: ${{ github.event.pull_request.base.sha }}
            merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
        secrets:
            CRM_PROD_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
            CRM_PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}

    compile:
        name: Compile Metadata
        needs: [changes, salesforce]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Require successful or unnecessary Salesforce validation
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  RELEVANT: ${{ needs.changes.outputs.salesforce }}
                  VALIDATION_RESULT: ${{ needs.salesforce.result }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  test "$CHANGES_RESULT" = success
                  if [ "$RELEVANT" != true ] || [ "$BASE_REF" != main ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
                    test "$VALIDATION_RESULT" = skipped
                    echo "Salesforce validation is not required for this change or PR source."
                  else
                    test "$RELEVANT" = true
                    test "$VALIDATION_RESULT" = success
                  fi

    run-tests:
        name: Run Apex Tests
        needs: compile
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Require successful Salesforce validation gate
              env:
                  RESULT: ${{ needs.compile.result }}
              run: test "$RESULT" = success

    check-code-coverage:
        name: Validate 85% Code Coverage
        needs: compile
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Require successful Salesforce validation gate
              env:
                  RESULT: ${{ needs.compile.result }}
              run: test "$RESULT" = success
