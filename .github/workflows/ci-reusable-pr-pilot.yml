name: '[CI] Reusable scratch org PR pilot'

on:
    workflow_run:
        workflows:
            - '\[PR\] Validate'
        types:
            - in_progress

permissions:
    contents: read
    pull-requests: read

jobs:
    prepare:
        name: Select and inspect PR
        runs-on: ubuntu-24.04
        outputs:
            salesforce: ${{ steps.result.outputs.salesforce }}
            number: ${{ steps.pull.outputs.number }}
            head_sha: ${{ steps.pull.outputs.head_sha }}
            base_sha: ${{ steps.pull.outputs.base_sha }}
            merge_sha: ${{ steps.pull.outputs.merge_sha }}
            baseline_run_id: ${{ steps.pull.outputs.baseline_run_id }}
            baseline_attempt: ${{ steps.pull.outputs.baseline_attempt }}
        steps:
            - name: Checkout trusted workflow scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.sha }}
                  path: trusted
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'

            - name: Select eligible PR and immutable merge commit
              id: pull
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  resolution="$(node trusted/scripts/ci-pr-pilot.cjs resolve)"
                  eligible="$(jq -er '.eligible | if type == "boolean" then tostring else error("Invalid eligibility") end' <<< "$resolution")"
                  echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
                  if [[ "$eligible" != "true" ]]; then
                    reason="$(jq -er '.reason' <<< "$resolution")"
                    echo "::notice::PR pilot skipped: $reason"
                    exit 0
                  fi
                  jq -r '
                    "number=\(.number)",
                    "head_sha=\(.headSha)",
                    "base_sha=\(.baseSha)",
                    "merge_sha=\(.mergeSha)",
                    "baseline_run_id=\(.baselineRunId)",
                    "baseline_attempt=\(.baselineAttempt)"
                  ' <<< "$resolution" >> "$GITHUB_OUTPUT"
                  number="$(jq -er '.number' <<< "$resolution")"
                  merge_sha="$(jq -er '.mergeSha' <<< "$resolution")"
                  baseline="$(jq -er '.baselineRunId' <<< "$resolution")"
                  attempt="$(jq -er '.baselineAttempt' <<< "$resolution")"
                  {
                    echo "## Reusable scratch-org PR pilot"
                    echo "- PR: [#$number]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number)"
                    echo "- PR merge commit: \`$merge_sha\`"
                    echo "- [Original PR validation]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$baseline/attempts/$attempt)"
                    echo "- Review this PR and commit before approving the ci-scratch-org environment."
                    echo "- Compare the actual checkout commits and package versions before treating results as equivalent."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Checkout PR merge commit as data
              if: steps.pull.outputs.eligible == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ steps.pull.outputs.merge_sha }}
                  path: candidate
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify the captured merge commit
              if: steps.pull.outputs.eligible == 'true'
              working-directory: candidate
              env:
                  MERGE_SHA: ${{ steps.pull.outputs.merge_sha }}
                  BASE_SHA: ${{ steps.pull.outputs.base_sha }}
                  HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
              run: node "$GITHUB_WORKSPACE/trusted/scripts/ci-pr-pilot.cjs" verify-snapshot "$MERGE_SHA" "$BASE_SHA" "$HEAD_SHA"

            - name: Classify PR changes using the trusted base
              if: steps.pull.outputs.eligible == 'true'
              id: changes
              working-directory: candidate
              env:
                  BASE_SHA: ${{ steps.pull.outputs.base_sha }}
                  HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
              run: |
                  set -euo pipefail
                  if ! git cat-file -e "$BASE_SHA:scripts/ci-changes.cjs" 2>/dev/null; then
                    echo "Trusted base filter is not available; run full validation."
                    echo "salesforce=true" >> "$GITHUB_OUTPUT"
                  else
                    git show "$BASE_SHA:scripts/ci-changes.cjs" > "$RUNNER_TEMP/ci-changes.cjs"
                    node "$RUNNER_TEMP/ci-changes.cjs" "$BASE_SHA" "$HEAD_SHA"
                  fi

            - name: Verify PR source before using Salesforce credentials
              if: steps.pull.outputs.eligible == 'true' && steps.changes.outputs.salesforce == 'true'
              working-directory: candidate
              run: node "$GITHUB_WORKSPACE/trusted/scripts/ci-pr-pilot.cjs" verify-source "$GITHUB_WORKSPACE/trusted/sfdx-project.json"

            - name: Publish pilot decision
              id: result
              env:
                  ELIGIBLE: ${{ steps.pull.outputs.eligible }}
                  SALESFORCE: ${{ steps.changes.outputs.salesforce }}
              run: |
                  set -euo pipefail
                  if [[ "$ELIGIBLE" != "true" ]]; then
                    echo "salesforce=false" >> "$GITHUB_OUTPUT"
                  elif [[ "$SALESFORCE" == "true" || "$SALESFORCE" == "false" ]]; then
                    echo "salesforce=$SALESFORCE" >> "$GITHUB_OUTPUT"
                    if [[ "$SALESFORCE" == "false" ]]; then
                      echo "::notice::PR pilot skipped: no Salesforce changes require validation."
                    fi
                  else
                    echo "Could not classify Salesforce changes." >&2
                    exit 1
                  fi

    validate:
        name: Run parallel Salesforce pilot
        needs: prepare
        if: needs.prepare.outputs.salesforce == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/ci-reusable-scratch-org.yml
        with:
            pull_number: ${{ needs.prepare.outputs.number }}
            head_sha: ${{ needs.prepare.outputs.head_sha }}
            base_sha: ${{ needs.prepare.outputs.base_sha }}
            merge_sha: ${{ needs.prepare.outputs.merge_sha }}
            baseline_run_id: ${{ needs.prepare.outputs.baseline_run_id }}
            baseline_attempt: ${{ needs.prepare.outputs.baseline_attempt }}
        secrets:
            CRM_PROD_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
            CRM_PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
