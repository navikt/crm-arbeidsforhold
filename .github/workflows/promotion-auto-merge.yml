name: '[PR] Auto-merge promotion version'
on:
    workflow_run:
        workflows: ['[HELPER] Promote Package']
        types: [completed]
        branches:
            - main

permissions:
    contents: read

jobs:
    enable-auto-merge:
        if: >-
            github.event.workflow_run.event == 'workflow_dispatch' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Find the open same-repository promotion PR
              id: promotion
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
                    --head auto/package-version-update \
                    --json number,baseRefOid,headRefOid,isCrossRepository,isDraft \
                    --jq '.[] | select(.isCrossRepository == false and .isDraft == false) | "number=\(.number)\nbase=\(.baseRefOid)\nhead=\(.headRefOid)"' \
                    >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              if: steps.promotion.outputs.number != ''
              with:
                  ref: ${{ steps.promotion.outputs.base }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              if: steps.promotion.outputs.number != ''
              with:
                  node-version: '22'
            - name: Verify promotion-only changes using trusted base code
              if: steps.promotion.outputs.number != ''
              id: changes
              env:
                  BASE_SHA: ${{ steps.promotion.outputs.base }}
                  HEAD_SHA: ${{ steps.promotion.outputs.head }}
              run: node scripts/ci-changes.cjs "$BASE_SHA" "$HEAD_SHA"
            - name: Enable auto-merge after required reviews and checks
              if: steps.changes.outputs.package_version_only == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.promotion.outputs.number }}
                  HEAD_SHA: ${{ steps.promotion.outputs.head }}
              run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --match-head-commit "$HEAD_SHA"
            - name: Report no eligible promotion PR
              if: steps.promotion.outputs.number == ''
              run: echo "No open, non-draft same-repository promotion PR targets main."
