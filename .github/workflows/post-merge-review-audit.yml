name: Post-merge review audit

on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: post-merge-review-audit-${{ github.sha }}
    cancel-in-progress: false

jobs:
    audit:
        name: Check review before merge
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
            issues: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - name: Create follow-up issue when review is missing
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/post-merge-review-audit.cjs
