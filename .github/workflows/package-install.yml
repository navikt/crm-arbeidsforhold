name: Install package in sandbox

on:
    workflow_call:
        inputs:
            packageId:
                required: true
                type: string
            org:
                required: true
                type: string
        secrets:
            CRM_PREPROD_SFDX_URL:
                required: false
            CRM_UAT_SFDX_URL:
                required: false
            CRM_PACKAGE_KEY:
                required: true

permissions:
    contents: read

jobs:
    install:
        uses: navikt/crm-workflows-base/.github/workflows/deployPackage.yml@aad6b4f48e419d71490db436da697cd7581a2c6a
        with:
            packageId: ${{ inputs.packageId }}
            org: ${{ inputs.org }}
            unpackagable: ./force-app/unpackagable-with-auto-deploy
        secrets: inherit
