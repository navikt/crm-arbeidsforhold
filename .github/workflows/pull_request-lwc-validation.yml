name: "[PR] LWC tests and formatting"
on:
  pull_request:
    branches:
      - '*'

jobs:
  lwc-validation:
    name: Jest tests and Prettier check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Prettier check changed files (newline-aware)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "origin/${BASE_REF}...HEAD" -- \
            '*.cls' '*.cmp' '*.component' '*.css' '*.html' '*.js' '*.json' '*.md' '*.page' '*.trigger' '*.xml' '*.yaml' '*.yml' \
            | xargs -0 -r node scripts/prettier-staged.cjs --check
