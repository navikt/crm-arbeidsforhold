name: '[PR] LWC tests and formatting'
on:
    pull_request:
        branches:
            - '*'

jobs:
    lwc-validation:
        name: Jest tests and Prettier check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Classify PR changes
              id: changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  filter=scripts/ci-changes.cjs
                  if [ -z "$(git ls-tree --name-only "$BASE_SHA" -- "$filter")" ]; then
                    echo "Trusted base filter is not available yet; run full validation."
                    echo "salesforce=true" >> "$GITHUB_OUTPUT"
                    echo "lwc=true" >> "$GITHUB_OUTPUT"
                  else
                    git show "$BASE_SHA:$filter" > "$RUNNER_TEMP/ci-changes.cjs"
                    node "$RUNNER_TEMP/ci-changes.cjs" "$BASE_SHA" "$HEAD_SHA"
                  fi
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run test:node
            - run: npm run test:dependency-report
            - name: LWC Jest tests
              if: steps.changes.outputs.lwc == 'true'
              run: npm run test:unit
            - name: Report unnecessary LWC tests
              if: steps.changes.outputs.lwc == 'false'
              run: echo "No package or LWC test configuration changes; LWC tests are not required."
            - name: Prettier check changed files (newline-aware)
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  git diff --name-only --diff-filter=ACMR -z "origin/${BASE_REF}...HEAD" -- \
                    '*.cls' '*.cmp' '*.component' '*.css' '*.html' '*.js' '*.json' '*.md' '*.page' '*.trigger' '*.xml' '*.yaml' '*.yml' \
                    | xargs -0 -r node scripts/prettier-staged.cjs --check
