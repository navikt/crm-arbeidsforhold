name: "[PR] LWC tests and formatting"
on:
  pull_request:
    branches:
      - '*'

jobs:
  lwc-validation:
    name: Jest tests and Prettier check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run prettier:check
