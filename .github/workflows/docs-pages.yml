name: Dokumentasjon og GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bygg og kontroller dokumentasjon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hent kjelda
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set opp Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Installer låste avhengnader
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs.txt
      - name: Test bygg og lenkjehandtering
        run: python -m unittest discover -s docs-site/tests
      - name: Bygg dokumentasjonen
        run: python docs-site/build_docs.py
      - name: Kontroller genererte lenkjer
        run: python docs-site/check_site.py site
      - name: Last opp Pages-artefakt
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    name: Publiser til GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Kontroller at dette er siste main-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "Nyare main-commit finst; denne dokumentasjonen blir ikkje publisert." >&2
            exit 1
          fi
      - name: Publiser godkjend dokumentasjon
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
