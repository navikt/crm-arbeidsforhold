name: Dokumentasjon og GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Oppdag dokumentasjonsendringar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - name: Hent kjelda
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Kontroller endra filer
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- \
            docs/ docs-site/ mkdocs.yml requirements-docs.in requirements-docs.txt \
            .github/workflows/docs-pages.yml ':(glob,icase)**/*.md' \
            ':(glob,icase)**/*.markdown' ':(glob,icase)**/*.mdx' \
            ':(glob,icase)**/*.mmd' ':(glob,icase)**/*.mermaid'; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Kan ikkje avgjere dokumentasjonsendringar." >&2
              exit "$status"
            fi
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Bygg og kontroller dokumentasjon
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hent kjelda
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set opp Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Installer låste avhengnader
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs.txt
      - name: Test bygg og lenkjehandtering
        run: python -m unittest discover -s docs-site/tests
      - name: Bygg dokumentasjonen
        run: python docs-site/build_docs.py
      - name: Kontroller genererte lenkjer
        run: python docs-site/check_site.py site
      - name: Last opp Pages-artefakt
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    name: Publiser til GitHub Pages
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Kontroller at dette er siste main-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "Nyare main-commit finst; denne dokumentasjonen blir ikkje publisert." >&2
            exit 1
          fi
      - name: Publiser godkjend dokumentasjon
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
