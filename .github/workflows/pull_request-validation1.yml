name: '[PR] Validate'
on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
            - converted_to_draft
        branches:
            - '**'
permissions:
    contents: read
jobs:
    run-pr-validation:
        name: Validate PR
        if: github.event.pull_request.draft == false
        uses: ./.github/workflows/salesforce-validation.yml
        permissions:
            contents: read
        secrets: inherit
