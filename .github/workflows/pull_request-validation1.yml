name: '[PR] Validate'
on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
            - converted_to_draft
        branches:
            - '**'
permissions:
    contents: read
    pull-requests: read
    actions: read
concurrency:
    group: pr-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: false
jobs:
    run-pr-validation:
        name: Validate PR
        if: github.event.pull_request.draft == false
        uses: ./.github/workflows/salesforce-validation.yml
        permissions:
            contents: read
            pull-requests: read
            actions: read
        secrets:
            CRM_PROD_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
            CRM_PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
