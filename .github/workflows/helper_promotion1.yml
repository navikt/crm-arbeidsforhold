name: "[HELPER] Promote Package"
on:
  workflow_dispatch:
    inputs:
      packageId:
        description: "Package ID"
        required: true
      comment:
        description: "Release Comment"
        required: true
permissions:
  contents: read
jobs:
  run-package-promotion:
    name: Promote Package
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/package-promotion.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      packageId: ${{ inputs.packageId }}
      comment: ${{ inputs.comment }}
    secrets:
      CRM_PROD_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
      CRM_PREPROD_SFDX_URL: ${{ secrets.CRM_PREPROD_SFDX_URL }}
      CRM_UAT_SFDX_URL: ${{ secrets.CRM_UAT_SFDX_URL }}
      CRM_PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
