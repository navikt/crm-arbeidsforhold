name: '[CI] Maintain CI scratch org'

on:
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    maintain:
        name: Maintain reusable CI scratch org
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 180
        environment: ci-scratch-org
        concurrency:
            group: crm-arbeidsforhold-reusable-scratch-org
            cancel-in-progress: false
            queue: max
        env:
            CI_SCRATCH_ORG_ID: ${{ vars.CI_SCRATCH_ORG_ID }}
            CI_SCRATCH_ORG_EXPIRATION: ${{ vars.CI_SCRATCH_ORG_EXPIRATION }}
            CI_SCRATCH_ORG_CONFIG_SHA256: ${{ vars.CI_SCRATCH_ORG_CONFIG_SHA256 }}

        steps:
            - name: Checkout trusted workflow scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: main
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'

            - name: Install Salesforce CLI
              run: npm install --global @salesforce/cli@2.158.7

            - name: Authenticate package-plan Dev Hub
              env:
                  DEVHUB_AUTH_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
              run: |
                  set -euo pipefail
                  if [[ -z "$DEVHUB_AUTH_URL" ]]; then
                    echo "::error title=Dev Hub::The existing package-plan Dev Hub credential is not configured."
                    exit 1
                  fi
                  auth_file="$RUNNER_TEMP/devhub-auth.txt"
                  login_log="$RUNNER_TEMP/devhub-login.log"
                  umask 077
                  printf '%s' "$DEVHUB_AUTH_URL" > "$auth_file"
                  trap 'rm -f "$auth_file" "$login_log"' EXIT
                  if ! sf org login sfdx-url --sfdx-url-file "$auth_file" --alias ci-devhub \
                    --set-default-dev-hub >"$login_log" 2>&1; then
                    echo "::error title=Dev Hub::Could not authenticate the package-plan Dev Hub."
                    exit 1
                  fi

            - name: Resolve current package plan
              id: plan
              env:
                  CI_SCRATCH_ORG_AUTH_URL: ${{ secrets.CI_SCRATCH_ORG_AUTH_URL }}
              run: |
                  set -euo pipefail
                  auth_file="$RUNNER_TEMP/registered-org-auth.txt"
                  login_log="$RUNNER_TEMP/registered-org-login.log"
                  plan_file="$RUNNER_TEMP/package-plan.json"
                  org_file="$RUNNER_TEMP/registered-org.json"
                  installed_file="$RUNNER_TEMP/installed-packages.json"
                  package_ids_file="$RUNNER_TEMP/package2-ids.json"
                  umask 077
                  trap 'rm -f "$auth_file" "$login_log" "$org_file" "$package_ids_file"' EXIT

                  fingerprint="$(node scripts/ci-scratch-plan.cjs fingerprint sfdx-project.json config/project-scratch-def.json)"
                  echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
                  if [[ -z "$CI_SCRATCH_ORG_AUTH_URL" || -z "$CI_SCRATCH_ORG_ID" ||
                        -z "$CI_SCRATCH_ORG_EXPIRATION" || -z "$CI_SCRATCH_ORG_CONFIG_SHA256" ]]; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The CI scratch-org Environment registration is incomplete." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [[ ! "$CI_SCRATCH_ORG_ID" =~ ^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$ ]]; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The registered CI scratch-org ID is invalid." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [[ "$CI_SCRATCH_ORG_CONFIG_SHA256" != "$fingerprint" ]]; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The scratch definition or source API version changed." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! expires="$(date -u -d "${CI_SCRATCH_ORG_EXPIRATION}T00:00:00Z" +%s 2>/dev/null)" ||
                     [[ ! "$CI_SCRATCH_ORG_EXPIRATION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The registered CI scratch-org expiration date is invalid." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  minimum="$(date -u -d '+7 days' +%s)"
                  if ((expires <= minimum)); then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The registered CI scratch org expires within seven days." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  printf '%s' "$CI_SCRATCH_ORG_AUTH_URL" > "$auth_file"
                  if ! sf org login sfdx-url --sfdx-url-file "$auth_file" --alias ci-reuse >"$login_log" 2>&1; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The registered CI scratch org could not be authenticated." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  unset CI_SCRATCH_ORG_AUTH_URL
                  if ! sf org display --target-org ci-reuse --json > "$org_file" 2>/dev/null ||
                     ! jq -e --arg expected "$CI_SCRATCH_ORG_ID" \
                       --arg expiration "$CI_SCRATCH_ORG_EXPIRATION" \
                       '.result.id == $expected and (.result.expirationDate | startswith($expiration))' \
                       "$org_file" >/dev/null; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The registered org identity or expiration could not be verified." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  command_token="$(node -e 'console.log(require("node:crypto").randomUUID())')"
                  echo "::stop-commands::$command_token"
                  status=0
                  node bin/package-dependencies.js --include-unreleased --dev-hub ci-devhub \
                    --plan-file "$plan_file" --no-color || status=$?
                  echo "::$command_token::"
                  if ((status != 0)); then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The current daily package plan could not be resolved." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! sf data query --target-org ci-devhub --use-tooling-api \
                    --query "SELECT Id, SubscriberPackageId FROM Package2" --json > "$package_ids_file" 2>/dev/null; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=Subscriber package IDs could not be resolved from the package-plan Dev Hub." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! node scripts/ci-scratch-plan.cjs map-package-ids "$plan_file" "$package_ids_file"; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The selected package IDs could not be mapped safely." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! sf package installed list --target-org ci-reuse --json > "$installed_file" 2>/dev/null; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=Installed package versions could not be read." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "needs_replacement=false" >> "$GITHUB_OUTPUT"

            - name: Reconcile installed package versions
              id: reconcile
              if: steps.plan.outputs.needs_replacement == 'false'
              continue-on-error: true
              env:
                  CRM_PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
              run: |
                  set -euo pipefail
                  output_file="$RUNNER_TEMP/reconcile-output.txt"
                  if ! node scripts/ci-scratch-plan.cjs reconcile sfdx-project.json "$RUNNER_TEMP/package-plan.json" \
                    "$RUNNER_TEMP/installed-packages.json" ci-reuse >"$output_file" 2>&1; then
                    node scripts/ci-scratch-plan.cjs diagnostics package "$output_file"
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=Package versions could not be reconciled safely in the registered org." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if grep -q '^Updated package versions:' "$output_file"; then
                    echo "packages_changed=true" >> "$GITHUB_OUTPUT"
                    echo "✅ Updated installed packages to the current daily plan." >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "packages_changed=false" >> "$GITHUB_OUTPUT"
                    echo "✅ Installed package versions already match the current daily plan." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  echo "needs_replacement=false" >> "$GITHUB_OUTPUT"

            - name: Smoke-test updated registered org
              id: smoke
              if: steps.plan.outputs.needs_replacement == 'false' && steps.reconcile.outcome == 'success' && steps.reconcile.outputs.needs_replacement == 'false'
              continue-on-error: true
              run: |
                  set -euo pipefail
                  rm -rf ./force-app/unpackagable ./force-app/unpackagable-with-auto-deploy ./force-app/scratch-org
                  node scripts/ci-scratch-plan.cjs tests force-app > "$RUNNER_TEMP/reuse-test-classes.json"
                  mapfile -t test_classes < <(jq -r '.[]' "$RUNNER_TEMP/reuse-test-classes.json")
                  if ((${#test_classes[@]} == 0)); then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=No repository Apex test classes were found for the smoke test." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  test_arguments=()
                  for test_class in "${test_classes[@]}"; do test_arguments+=(--tests "$test_class"); done
                  if ! sf project deploy start --dry-run --source-dir force-app --target-org ci-reuse \
                    --test-level RunSpecifiedTests "${test_arguments[@]}" --coverage-formatters json --wait 60 --json \
                    >"$RUNNER_TEMP/reuse-deploy-response.json" 2>"$RUNNER_TEMP/reuse-deploy-errors.log"; then
                    node scripts/ci-scratch-plan.cjs diagnostics deployment "$RUNNER_TEMP/reuse-deploy-response.json"
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=Check-only metadata validation or repository Apex tests failed after package reconciliation." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! node scripts/ci-scratch-plan.cjs coverage \
                    "$RUNNER_TEMP/reuse-deploy-response.json" force-app; then
                    echo "needs_replacement=true" >> "$GITHUB_OUTPUT"
                    echo "reason=The updated org failed the 85 percent repository coverage threshold." >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "needs_replacement=false" >> "$GITHUB_OUTPUT"
                  echo "✅ Registered org passed check-only deploy, repository Apex tests, and 85% coverage." >> "$GITHUB_STEP_SUMMARY"

            - name: Notify repository owners
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
                  INSPECT_OUTCOME: ${{ steps.plan.outcome }}
                  INSPECT_NEEDS_REPLACEMENT: ${{ steps.plan.outputs.needs_replacement }}
                  INSPECT_REASON: ${{ steps.plan.outputs.reason }}
                  RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
                  RECONCILE_NEEDS_REPLACEMENT: ${{ steps.reconcile.outputs.needs_replacement }}
                  RECONCILE_REASON: ${{ steps.reconcile.outputs.reason }}
                  SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
                  SMOKE_NEEDS_REPLACEMENT: ${{ steps.smoke.outputs.needs_replacement }}
                  SMOKE_REASON: ${{ steps.smoke.outputs.reason }}
              run: |
                  set -euo pipefail
                  reason=""
                  if [[ "$INSPECT_OUTCOME" != "success" ]]; then
                    reason="The scheduled maintenance check failed before org health could be verified; see this Actions run."
                  elif [[ "$INSPECT_NEEDS_REPLACEMENT" != "false" ]]; then
                    reason="${INSPECT_REASON:-The org inspection did not confirm a healthy registration; see this Actions run.}"
                  elif [[ "$RECONCILE_OUTCOME" != "success" || "$RECONCILE_NEEDS_REPLACEMENT" != "false" ]]; then
                    reason="${RECONCILE_REASON:-Package reconciliation did not complete successfully; see this Actions run.}"
                  elif [[ "$SMOKE_OUTCOME" != "success" || "$SMOKE_NEEDS_REPLACEMENT" != "false" ]]; then
                    reason="${SMOKE_REASON:-The smoke test did not complete successfully; see this Actions run.}"
                  fi
                  if [[ -n "$reason" ]]; then
                    printf '### CI scratch-org maintenance\n\n**Action needed:** %s\n\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
                    node scripts/ci-scratch-org-maintenance.cjs ensure "$reason" \
                      "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  else
                    printf '### CI scratch-org maintenance\n\nOrg inspection, package reconciliation and smoke test passed.\n' \
                      >> "$GITHUB_STEP_SUMMARY"
                    node scripts/ci-scratch-org-maintenance.cjs resolve
                  fi
